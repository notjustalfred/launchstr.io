<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In — Launchstr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0B1120; --teal: #00C9A7; --gold: #F0A500; --gray: #8a93a8; --white: #FAFAF8; }
    body { font-family: 'Inter', sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .card { max-width: 480px; }
    .icon { font-size: 4rem; margin-bottom: 1.25rem; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 900; letter-spacing: -1px; margin-bottom: 0.65rem; }
    h1 span { color: var(--teal); }
    p { color: var(--gray); font-size: 0.97rem; line-height: 1.7; margin-bottom: 1rem; }
    .redirect-bar { background: rgba(0,201,167,0.1); border: 1px solid rgba(0,201,167,0.25); border-radius: 12px; padding: 1rem 1.5rem; margin: 1.5rem 0; }
    .redirect-bar p { color: var(--teal); font-weight: 600; font-size: 0.9rem; margin: 0; }
    .btn { display: inline-block; background: var(--teal); color: var(--navy); font-weight: 800; font-size: 0.95rem; padding: 0.85rem 2rem; border-radius: 10px; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #00a98c; }
    .back { display: block; margin-top: 1.25rem; color: var(--gray); font-size: 0.83rem; text-decoration: none; }
    .back:hover { color: var(--teal); }
    #countdown { font-weight: 800; color: var(--white); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>You're In. Let's <span>Build.</span></h1>
    <p>Your intake form has been submitted. We'll be in touch within 1 business day to kick things off.</p>
    <p>Next step: complete payment to lock in your spot and get your project started.</p>

    <div class="redirect-bar" id="redirectBar" style="display:none">
      <p>Redirecting to payment in <span id="countdown">3</span>...</p>
    </div>

    <a href="#" id="payLink" class="btn">Complete Payment →</a>
    <a href="index.html" class="back">← Back to Launchstr</a>
  </div>

  <script>
    const link = sessionStorage.getItem('launchstr_stripe');
    const payLink = document.getElementById('payLink');
    const redirectBar = document.getElementById('redirectBar');
    const countEl = document.getElementById('countdown');

    if (link && !link.startsWith('STRIPE_')) {
      payLink.href = link;
      redirectBar.style.display = 'block';
      let n = 3;
      const timer = setInterval(() => {
        n--;
        countEl.textContent = n;
        if (n <= 0) {
          clearInterval(timer);
          window.location.href = link;
        }
      }, 1000);
      sessionStorage.removeItem('launchstr_stripe');
    } else {
      // Stripe links not configured yet — show contact fallback
      payLink.href = 'mailto:hello@launchstr.io?subject=Payment%20for%20Launchstr&body=I%20just%20submitted%20my%20intake%20form.%20Please%20send%20me%20a%20payment%20link.';
      payLink.textContent = 'Email Us to Complete Payment →';
    }
  </script>
</body>
</html>
